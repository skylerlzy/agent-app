# GitLab CI/CD
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - verify

variables:
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  NODE_ENV: "production"
  NPM_CONFIG_PROGRESS: "false"
  GIT_DEPTH: "50"

default:
  image: public.ecr.aws/docker/library/node:20-bookworm-slim
  interruptible: true
  before_script:
    - cd "${CI_PROJECT_DIR}"

lint_typecheck:
  stage: verify
  cache: []
  timeout: 20m
  script:
    - set -eux
    - node -v
    - npm -v
    - npm ci --no-audit --no-fund
    - npm run lint:ci
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build_optional:
  stage: verify
  cache: []
  timeout: 30m
  allow_failure: true
  script:
    - set -eux
    - npm ci --no-audit --no-fund
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual