# GitLab CI/CD — 对照课程《2026 软工三》第三节 CICD（GitLab Runner）：
# 随仓库附带 pipeline；依赖国内镜像；默认分支/MR 验证；合并默认分支后自动部署；构建记录与结果在 GitLab Pipelines 中查看。
# 详细说明见 docs/GitLab-Runner与NJUGitLab镜像.md

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - verify
  - deploy

variables:
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  NEXT_TELEMETRY_DISABLED: "1"
  # Next/Clerk/Convex 构建期读取；生产请在 GitLab CI/CD Variables 覆盖为真实值
  NEXT_PUBLIC_CONVEX_URL: "https://build-placeholder.convex.cloud"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5kZXYk"
  CLERK_SECRET_KEY: "sk_test_ci_placeholder_replace_in_gitlab_variables"
  GIT_DEPTH: "50"

default:
  image: public.ecr.aws/docker/library/node:20-alpine
  interruptible: true
  before_script:
    - cd "${CI_PROJECT_DIR}"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull-push

lint_typecheck_build:
  stage: verify
  timeout: 45m
  # 本机 Windows 注册 Runner 时若填写了 tag（如 local-win-docker），在此取消注释并保持一致：
  # tags:
  #   - local-win-docker
  # 学校共享 Runner 若要求 tag，改为例如 school-docker
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 课程要求：合并到默认分支后，Web 项目自动部署最新代码；构建状态自动体现在 GitLab（无需 Jenkins 式「回传」）
# 配置方式（二选一，在 CI/CD Variables 中设置，勿提交仓库）：
#   A) DEPLOY_WEBHOOK_URL — 部署平台 Redeploy Webhook；可选 DEPLOY_WEBHOOK_TOKEN（Bearer）
#   B) DEPLOY_SSH_HOST + DEPLOY_SSH_USER + SSH_PRIVATE_KEY + DEPLOY_SSH_COMMAND — 在远端执行一条命令（如 git pull && docker compose up -d）
deploy_production:
  stage: deploy
  needs: ["lint_typecheck_build"]
  timeout: 20m
  # 若 verify 使用了 tags，deploy 需使用相同 tags，否则可能落到不同 Runner 上
  environment:
    name: production
    url: $DEPLOYMENT_PUBLIC_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - cd "${CI_PROJECT_DIR}"
    - apk add --no-cache curl openssh-client bash
  script:
    - bash scripts/ci-deploy.sh
