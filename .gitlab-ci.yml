# GitLab CI/CD
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - verify

variables:
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_FETCH_RETRIES: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  GIT_DEPTH: "50"

default:
  image: public.ecr.aws/docker/library/node:20-bookworm-slim
  interruptible: true
  before_script:
    - cd "${CI_PROJECT_DIR}"

lint_typecheck:
  stage: verify
  cache: []
  timeout: 20m
  script:
    - set -eux
    - echo "[CI] start $(date -Iseconds)"
    - node -v
    - npm -v
    - timeout 8m npm ci --include=dev --no-audit --no-fund
    - timeout 5m npm run lint:ci
    - timeout 5m npm run typecheck
    - echo "[CI] done $(date -Iseconds)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH