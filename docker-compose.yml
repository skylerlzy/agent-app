# 本地/另一台电脑：仅需安装 Docker Desktop，配置好 .env.local 后执行
#   docker compose up
# 或双击 Windows 下的「一键启动.bat」
#
# 首次启动会在容器内 npm ci，可能需 1～3 分钟；node_modules 缓存在命名卷中。

services:
  web:
    image: node:20-bookworm-slim
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # 在 Docker（尤其 Windows）下改善文件监听
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    command: >
      sh -c "npm ci --no-audit --fund=false
      && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  web_node_modules:
